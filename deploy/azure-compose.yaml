services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:5741ab30aae42af23ca57d9b98a6d4544cb09c21f372f92c5ee55312fa8b8b0c
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - qwen-models:/models
    command:
      - -hf
      - Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
      - --alias
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "2"
      - --threads-batch
      - "2"
      - --parallel
      - "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 12

  app:
    build: .
    image: echopulse-azure:demo
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      qwen:
        condition: service_healthy
    ports:
      # Tunnel SSH del tesis (127.0.0.1 no sale a la red) y la puerta pública de
      # la demo: HTTP plano en 80 porque un HTTPS gratis exige dominio propio.
      - "127.0.0.1:7860:7860"
      - "80:7860"
    environment:
      PORT: "7860"
      # Tope de turnos por IP y minuto: un turno de Qwen en CPU tarda ~7 s y la
      # VM tiene 2 núcleos; sin esto, la cola pública reventaría la latencia.
      LIMITE_POR_MINUTO: "12"
      TABLA_MAESTRA_DIR: /app/tabla_maestra/train
      OLLAMA_ENABLED: "0"
      LLM_BASE_URL: http://qwen:8080/v1
      LLM_MODEL: qwen
      LLM_TIMEOUT: "180"
      LLM_ORDER: custom
      # Qwen 1.5B en CPU divaga con la temperatura por defecto (0.7): exclamaciones
      # sin sentido tipo "¡A la vez más y más!". 0.5 mantiene variedad sin el ruido.
      LLM_TEMPERATURA_CHAT: "0.5"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - app-logs:/app/logs

  # HTTPS gratis sin comprar dominio: ngrok termina el TLS fuera de la VM y desde
  # ahí baja al contenedor, así que la VM solo hace conexiones SALIENTES y el NSG
  # puede cerrar el puerto 80. El token vive en .env de esta carpeta (chmod 600),
  # nunca en el repo. Es opcional: sin `--profile tunnel` no se crea ni se pide.
  tunnel:
    image: ngrok/ngrok:alpine
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      # La imagen de ngrok no trae shell (es Nix), así que no se puede entrar al
      # contenedor a leer el inspector: con el log del agente en stdout la URL
      # asignada sale en `docker logs echopulse-tunnel-1`.
      NGROK_LOG: /dev/stdout
      NGROK_LOG_FORMAT: logfmt
    ports:
      # Inspector web de ngrok, solo en loopback (127.0.0.1 nunca sale a la red).
      # Sirve para comprobar desde la VM que ngrok reenvía X-Forwarded-For, que es
      # como el limiter de la app distingue a cada visitante.
      - "127.0.0.1:4040:4040"
    command:
      - http
      - app:7860
      # Dominio gratuito reservado en la cuenta ngrok: fijarlo con --url en vez de
      # dejar que ngrok asigne uno al azar hace que el enlace de la tesis sea el
      # mismo para siempre, aunque se reinicie la VM. No es un secreto (es la URL
      # pública); el token sí vive solo en .env de la VM.
      - --url=https://myself-private-trilogy.ngrok-free.dev

  # El plan gratis de ngrok interpone una página de aviso a todo el tráfico HTML de
  # navegador (se quita solo pagando o con cabeceras, y un navegador no puede poner
  # cabeceras al abrir el enlace). Cloudflare Quick Tunnel da HTTPS gratis sin ese
  # aviso y sin cuenta. La contra: la URL *.trycloudflare.com se asigna al arrancar,
  # así que si el contenedor se reinicia cambia; el ngrok de arriba queda de respaldo
  # con enlace fijo.
  tunnel-cf:
    image: cloudflare/cloudflared:latest
    profiles: ["cf"]
    restart: unless-stopped
    depends_on:
      - app
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://app:7860

volumes:
  qwen-models:
  app-logs:
