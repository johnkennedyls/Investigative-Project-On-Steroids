<!doctype html>
<html lang="es">
  <head>
    <title>EchoPulse AI - Recomendador de Intención</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --neon: #00f2ff;
        --bg: #0b0b0f;
        --card: #15151e;
        --text: #e0e0e0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 40px 20px;
      }

      .container {
        width: 100%;
        max-width: 650px;
        background: rgba(20, 20, 25, 0.95);
        padding: 40px;
        border: 1px solid rgba(0, 242, 255, 0.3);
        border-radius: 24px;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(0, 242, 255, 0.1);
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 2.2rem;
        margin: 0;
        background: linear-gradient(90deg, #fff, var(--neon));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 4px;
        font-weight: 800;
      }

      .subtitle {
        color: #666;
        font-size: 0.85rem;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-group {
        position: relative;
        margin-bottom: 25px;
      }

      textarea {
        width: 100%;
        height: 120px;
        background: #000;
        color: #fff;
        border: 1px solid #333;
        padding: 20px;
        border-radius: 16px;
        font-size: 1rem;
        resize: none;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
      }

      textarea:focus {
        border-color: var(--neon);
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
      }

      button {
        width: 100%;
        padding: 18px;
        background: var(--neon);
        color: #000;
        border: none;
        border-radius: 14px;
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
        background: #fff;
      }

      button:disabled {
        background: #333;
        color: #666;
        cursor: not-allowed;
        transform: none;
      }

      .results-list {
        list-style: none;
        padding: 0;
        margin-top: 40px;
      }

      .song-card {
        background: var(--card);
        margin-bottom: 12px;
        padding: 16px 20px;
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid transparent;
        transition: 0.3s;
        opacity: 0;
        animation: fadeIn 0.4s ease forwards;
      }

      .song-card:hover {
        border-color: var(--neon);
        transform: scale(1.02);
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .song-info .title {
        color: #fff;
        font-weight: 600;
        font-size: 1.05rem;
      }

      .song-info .artist {
        color: #888;
        font-size: 0.85rem;
        margin-top: 4px;
      }

      .match-badge {
        text-align: right;
      }

      .match-val {
        color: var(--neon);
        font-weight: 700;
        font-size: 1.1rem;
        display: block;
      }

      .match-label {
        font-size: 0.65rem;
        color: #555;
        text-transform: uppercase;
      }

      .status-msg {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
      }

      .error {
        color: #ff4d4d;
      }
      .loading {
        color: var(--neon);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ECHOPULSE AI</h1>
        <p class="subtitle">Módulo 3: Motor de Intención Semántica</p>
      </header>

      <div class="input-group">
        <textarea
          id="lyricInput"
          placeholder="Describe cómo te sientes o qué música buscas... (ej: 'Necesito algo alegre para estudiar')"
        ></textarea>
      </div>

      <button id="searchBtn" onclick="performSearch()">
        Analizar Intención
      </button>

      <div id="status"></div>
      <ul id="results" class="results-list"></ul>
    </div>

    <script>
      async function performSearch() {
        const input = document.getElementById("lyricInput");
        const resultsUl = document.getElementById("results");
        const btn = document.getElementById("searchBtn");
        const status = document.getElementById("status");

        if (input.value.trim().length < 5) {
          status.innerHTML =
            '<p class="error">⚠️ Describe tu intención con más detalle.</p>';
          return;
        }

        btn.disabled = true;
        btn.innerText = "Procesando Atenciones...";
        resultsUl.innerHTML = "";
        status.innerHTML =
          '<p class="loading">Codificando vectores de contexto...</p>';

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lyrics: input.value }),
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          status.innerHTML = "";

          data.forEach((song, i) => {
            const li = document.createElement("li");
            li.className = "song-card";
            li.style.animationDelay = i * 0.1 + "s";
            li.innerHTML = `
              <div class="song-info">
                <div class="title">${song.track_name}</div>
                <div class="artist">${song.artist_name}</div>
              </div>
              <div class="match-badge">
                <span class="match-val">${(song.similarity * 100).toFixed(2)}%</span>
                <span class="match-label">Afinidad</span>
              </div>
            `;
            resultsUl.appendChild(li);
          });
        } catch (err) {
          status.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`;
        } finally {
          btn.disabled = false;
          btn.innerText = "Analizar Intención";
        }
      }
    </script>
  </body>
</html>
